
name: CI

on: [push]

concurrency:
  group: relewise-sdk-php-integration-dataset
  cancel-in-progress: false
  queue: max

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: php-actions/composer@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Generate PHP classes
        run: ./generate.sh

      - name: Seed persistent integration fixtures
        env:
          DATASET_ID: a5dab1ca-e6f3-43e7-93c5-69eea1bf8cfd
          API_KEY: ${{ secrets.INTEGRATION_TESTS_DATASET_API_KEY }}
          SERVER_URL: https://sandbox-api.relewise.com/
        run: php tests/seed-integration-fixtures.php

      - name: PHPUnit Tests
        uses: php-actions/phpunit@v4
        with:
          bootstrap: vendor/autoload.php
          configuration: tests/phpunit.xml
          test_suffix: .php
          php_extensions: "xdebug"
        env:
          DATASET_ID: a5dab1ca-e6f3-43e7-93c5-69eea1bf8cfd
          API_KEY: ${{secrets.INTEGRATION_TESTS_DATASET_API_KEY}}
          SERVER_URL: https://sandbox-api.relewise.com/
          XDEBUG_MODE: coverage
