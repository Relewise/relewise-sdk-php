name: Publish to Packagist

on:
  release:
    types: [published]

concurrency:
  group: relewise-sdk-php-integration-dataset
  cancel-in-progress: false
  queue: max

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, json, libxml, mbstring, tokenizer, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Generate PHP classes
        run: ./generate.sh

      - name: Seed persistent integration fixtures
        env:
          DATASET_ID: a5dab1ca-e6f3-43e7-93c5-69eea1bf8cfd
          API_KEY: ${{ secrets.INTEGRATION_TESTS_DATASET_API_KEY }}
          SERVER_URL: https://sandbox-api.relewise.com/
        run: php tests/seed-integration-fixtures.php

      - name: PHPUnit Tests
        run: vendor/bin/phpunit --bootstrap vendor/autoload.php --configuration tests/phpunit.xml
        env:
          DATASET_ID: a5dab1ca-e6f3-43e7-93c5-69eea1bf8cfd
          API_KEY: ${{secrets.INTEGRATION_TESTS_DATASET_API_KEY}}
          SERVER_URL: https://sandbox-api.relewise.com/

      - name: Publish to Packagist
        run: composer publish relewise ${{ secrets.packagist_token }}

      - name: Ingest new data in MCP server
        run: curl -X PUT -H "x-api-key:${{ secrets.MCP_INGESTION_API_KEY }}" -H "content-length:0" https://mcp.relewise.com/IngestDataSource/Php  
